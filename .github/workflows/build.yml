name: build

# 仓库原先没有 CI（.github 下只有 ISSUE_TEMPLATE），本文件是 2026-11-19 为
# 「HyperOS 3 适配」补的最小构建流水线：只做 assembleRelease + 上传产物，
# 不签名（无 keystore.properties 时 release 自动退回 debug 签名，见 app/build.gradle.kts）。

on:
  push:
    branches: [ 'fix/**', 'hyperos3/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 本工程要求 compileSdk 37（minor 2）/ buildTools 37.0.0 / NDK 28.2.13676358 / cmake 3.22.1
      # （见 app/build.gradle.kts 的 compileSdk / compileSdkMinor）。
      # ⚠️ 公共 SDK 仓库里 platform 37 是**按小版本**发布的：包名是 platforms;android-37.0 / -37.1 / -37.2，
      #    不存在 "platforms;android-37"（2026-11-19 实测：装 android-37 会报
      #    "Failed to find package"）。compileSdkMinor = 2 ⇒ 必须装 -37.2。
      - name: Android SDK 37.2 + NDK 28.2
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" \
            "platforms;android-37.2" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: assembleRelease
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 产物摘要
        run: |
          ls -lh app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HyperExtreme-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
