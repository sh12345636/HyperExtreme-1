name: build

# 仓库原先没有 CI（.github 下只有 ISSUE_TEMPLATE），本文件是 2026-11-19 为
# 「HyperOS 3 适配」补的最小构建流水线：只做 assembleRelease + 上传产物，
# 不签名（无 keystore.properties 时 release 自动退回 debug 签名，见 app/build.gradle.kts）。

on:
  push:
    branches: [ 'fix/**', 'hyperos3/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 本工程要求 compileSdk 37 / buildTools 37.0.0 / NDK 28.2.13676358 / cmake 3.22.1
      # （见 app/build.gradle.kts），runner 预装版本不够，必须显式装。
      - name: Android SDK 37 + NDK 28.2
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: assembleRelease
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: 产物摘要
        run: |
          ls -lh app/build/outputs/apk/release/
          sha256sum app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HyperExtreme-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
